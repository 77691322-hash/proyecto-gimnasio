<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Categorías')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Categorías</h1>
        <a class="btn btn-danger" th:href="@{/categorias/nuevo}">Nueva categoría</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="categoria : ${categorias}">
                    <td th:text="${categoria.nombre}"></td>
                    <td th:text="${categoria.descripcion}"></td>
                    <td>
                        <span class="badge" th:classappend="${categoria.estado} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${categoria.estado} ? 'Activa' : 'Oculta'"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark" th:href="@{/categorias/editar/{id}(id=${categoria.idCategoria})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/categorias/estado/{id}(id=${categoria.idCategoria})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    th:text="${categoria.estado} ? 'Ocultar' : 'Activar'"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${categorias.isEmpty()}">
                    <td class="text-center text-muted py-4" colspan="4">No hay categorías registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
