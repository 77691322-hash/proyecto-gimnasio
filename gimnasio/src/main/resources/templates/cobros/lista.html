<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Historial de cobros')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Historial de cobros</h1>
        <a class="btn btn-danger" th:href="@{/cobros/solicitudes}">Atender solicitudes</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Paquete</th>
                    <th>Método de pago</th>
                    <th class="text-end">Monto</th>
                    <th>Suscripción</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cobro : ${cobros}">
                    <td th:text="${#temporals.format(cobro.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${cobro.suscripcion.cliente.nombre}"></td>
                    <td th:text="${cobro.suscripcion.paquete.nombre}"></td>
                    <td th:text="${cobro.metodoPago}"></td>
                    <td class="text-end" th:text="'S/ ' + ${cobro.monto}"></td>
                    <td>
                        <span class="badge" th:classappend="${cobro.suscripcion.vigente} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="(${cobro.suscripcion.vigente} ? 'Vigente hasta ' : 'Venció el ') + ${#temporals.format(cobro.suscripcion.fechaFin, 'dd/MM/yyyy')}"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark" th:href="@{/cobros/comprobante/{id}(id=${cobro.idCobro})}">Comprobante</a>
                    </td>
                </tr>
                <tr th:if="${cobros.isEmpty()}">
                    <td class="text-center text-muted py-4" colspan="7">Todavía no hay cobros registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
