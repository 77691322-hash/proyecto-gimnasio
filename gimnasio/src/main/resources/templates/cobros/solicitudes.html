<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Solicitudes de compra')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Solicitudes de compra</h1>
        <a class="btn btn-outline-dark" th:href="@{/paquetes/catalogo}">Ver catálogo de paquetes</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>DNI</th>
                    <th>Paquete</th>
                    <th class="text-end">Monto</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="solicitud : ${solicitudes}">
                    <td th:text="${#temporals.format(solicitud.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${solicitud.cliente.nombre}"></td>
                    <td th:text="${solicitud.cliente.dni}"></td>
                    <td th:text="${solicitud.paquete.nombre}"></td>
                    <td class="text-end" th:text="'S/ ' + ${solicitud.paquete.precio}"></td>
                    <td>
                        <span class="badge text-bg-warning" th:if="${solicitud.estado == 'PENDIENTE'}">Pendiente</span>
                        <span class="badge text-bg-success" th:if="${solicitud.estado == 'ATENDIDA'}">Atendida</span>
                        <span class="badge text-bg-secondary" th:if="${solicitud.estado == 'RECHAZADA'}">Rechazada</span>
                    </td>
                    <td class="text-end">
                        <div th:if="${solicitud.estado == 'PENDIENTE'}">
                            <a class="btn btn-sm btn-danger" th:href="@{/cobros/nuevo(solicitud=${solicitud.idSolicitud})}">Registrar cobro</a>
                            <form class="d-inline" method="post" th:action="@{/cobros/rechazar/{id}(id=${solicitud.idSolicitud})}">
                                <button class="btn btn-sm btn-outline-secondary" type="submit">Rechazar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${solicitudes.isEmpty()}">
                    <td class="text-center text-muted py-4" colspan="7">Todavía no hay solicitudes de compra.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
