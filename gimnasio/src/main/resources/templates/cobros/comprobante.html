<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Comprobante')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div th:replace="~{fragmentos :: mensajes}"></div>
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4 marca text-center">GYM SYSTEM</h1>
                    <p class="text-center text-muted" th:text="'Comprobante de cobro N.° ' + ${cobro.idCobro}"></p>
                    <table class="table mb-3">
                        <tbody>
                        <tr>
                            <th>Fecha</th>
                            <td th:text="${#temporals.format(cobro.fecha, 'dd/MM/yyyy HH:mm')}"></td>
                        </tr>
                        <tr>
                            <th>Cliente</th>
                            <td th:text="${cobro.suscripcion.cliente.nombre}"></td>
                        </tr>
                        <tr>
                            <th>DNI</th>
                            <td th:text="${cobro.suscripcion.cliente.dni}"></td>
                        </tr>
                        <tr>
                            <th>Paquete</th>
                            <td th:text="${cobro.suscripcion.paquete.nombre}"></td>
                        </tr>
                        <tr>
                            <th>Método de pago</th>
                            <td th:text="${cobro.metodoPago}"></td>
                        </tr>
                        <tr>
                            <th>Monto pagado</th>
                            <td class="fw-bold" th:text="'S/ ' + ${cobro.monto}"></td>
                        </tr>
                        </tbody>
                    </table>
                    <div class="alert alert-success text-center mb-0">
                        Suscripción vigente del
                        <strong th:text="${#temporals.format(cobro.suscripcion.fechaInicio, 'dd/MM/yyyy')}"></strong>
                        al
                        <strong th:text="${#temporals.format(cobro.suscripcion.fechaFin, 'dd/MM/yyyy')}"></strong>
                    </div>
                </div>
                <div class="card-footer bg-white text-center no-imprimir">
                    <button class="btn btn-dark" type="button" onclick="window.print()">Imprimir</button>
                    <a class="btn btn-outline-secondary" th:href="@{/cobros}">Ver historial de cobros</a>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
