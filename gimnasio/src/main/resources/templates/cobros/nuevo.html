<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Registrar cobro')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div th:replace="~{fragmentos :: mensajes}"></div>
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h1 class="h5 mb-0">Registrar cobro</h1>
                </div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-4">Cliente</dt>
                        <dd class="col-sm-8" th:text="${solicitud.cliente.nombre} + ' (DNI ' + ${solicitud.cliente.dni} + ')'"></dd>
                        <dt class="col-sm-4">Paquete</dt>
                        <dd class="col-sm-8" th:text="${solicitud.paquete.nombre}"></dd>
                        <dt class="col-sm-4">Incluye</dt>
                        <dd class="col-sm-8">
                            <span class="badge text-bg-light border me-1" th:each="detalle : ${solicitud.paquete.detalles}"
                                  th:text="${detalle.producto.nombre}"></span>
                        </dd>
                        <dt class="col-sm-4">Vigencia</dt>
                        <dd class="col-sm-8" th:text="${#temporals.format(fechaInicio, 'dd/MM/yyyy')} + ' al ' + ${#temporals.format(fechaFin, 'dd/MM/yyyy')}"></dd>
                    </dl>
                    <hr>
                    <form method="post" th:action="@{/cobros/registrar}">
                        <input type="hidden" name="idSolicitud" th:value="${solicitud.idSolicitud}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="monto">Monto (S/)</label>
                                <input class="form-control" id="monto" th:value="${solicitud.paquete.precio}" readonly>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="metodoPago">Método de pago</label>
                                <select class="form-select" id="metodoPago" name="metodoPago" required>
                                    <option>Efectivo</option>
                                    <option>Tarjeta</option>
                                    <option>Yape / Plin</option>
                                    <option>Transferencia</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn-danger" type="submit">Registrar Cobro</button>
                        <a class="btn btn-outline-secondary" th:href="@{/cobros/solicitudes}">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
