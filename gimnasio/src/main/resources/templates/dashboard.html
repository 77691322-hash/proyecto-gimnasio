<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Dashboard')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <h1 class="h3 mb-3">Panel de métricas</h1>

    <div class="row row-cols-2 row-cols-lg-5 g-3 mb-4">
        <div class="col">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <p class="display-6 fw-bold text-danger mb-0" th:text="${clientesActivos}"></p>
                    <p class="text-muted mb-0">Clientes activos</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <p class="display-6 fw-bold text-danger mb-0" th:text="${suscripcionesVigentes}"></p>
                    <p class="text-muted mb-0">Suscripciones vigentes</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <p class="display-6 fw-bold text-danger mb-0" th:text="${suscripcionesPorVencer}"></p>
                    <p class="text-muted mb-0">Vencen en 7 días</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <p class="display-6 fw-bold text-danger mb-0" th:text="${paquetesActivos}"></p>
                    <p class="text-muted mb-0">Paquetes activos</p>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card shadow-sm text-center h-100">
                <div class="card-body">
                    <p class="display-6 fw-bold text-danger mb-0" th:text="${personalPresente}"></p>
                    <p class="text-muted mb-0">Personal presente</p>
                </div>
            </div>
        </div>
    </div>

    <form class="row g-2 align-items-end mb-3" method="get" th:action="@{/dashboard}">
        <div class="col-auto">
            <label class="form-label" for="desde">Desde</label>
            <input class="form-control" type="date" id="desde" name="desde" th:value="${desde}">
        </div>
        <div class="col-auto">
            <label class="form-label" for="hasta">Hasta</label>
            <input class="form-control" type="date" id="hasta" name="hasta" th:value="${hasta}">
        </div>
        <div class="col-auto">
            <button class="btn btn-dark" type="submit">Filtrar</button>
        </div>
    </form>

    <div class="row g-3">
        <div th:replace="~{fragmentos :: barras('Ingresos por día en soles', ${ingresosPorDia})}"></div>
        <div th:replace="~{fragmentos :: barras('Cobros por día', ${cobrosPorDia})}"></div>
        <div th:replace="~{fragmentos :: barras('Asistencias por día', ${asistenciasPorDia})}"></div>
        <div th:replace="~{fragmentos :: barras('Ingresos por mes del año actual en soles', ${ingresosPorMes})}"></div>
        <div th:replace="~{fragmentos :: barras('Suscripciones por mes del año actual', ${suscripcionesPorMes})}"></div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
