<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Usuarios')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Usuarios del sistema</h1>
        <a class="btn btn-danger" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Usuario</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cuenta : ${usuarios}">
                    <td th:text="${cuenta.nombreUsuario}"></td>
                    <td th:text="${cuenta.correo}"></td>
                    <td th:text="${cuenta.rol == 'ADMINISTRADOR'} ? 'Administrador' : 'Personal'"></td>
                    <td>
                        <span class="badge" th:classappend="${cuenta.estado} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${cuenta.estado} ? 'Activo' : 'Desactivado'"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark" th:href="@{/usuarios/editar/{id}(id=${cuenta.idUsuario})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/usuarios/estado/{id}(id=${cuenta.idUsuario})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    th:text="${cuenta.estado} ? 'Desactivar' : 'Activar'"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
