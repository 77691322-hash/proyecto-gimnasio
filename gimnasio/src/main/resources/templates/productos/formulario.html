<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Registrar producto o servicio')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div th:replace="~{fragmentos :: mensajes}"></div>
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h1 class="h5 mb-0" th:text="${producto.idProducto == null} ? 'Registrar producto o servicio' : 'Editar producto o servicio'"></h1>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/productos/guardar}" th:object="${producto}">
                        <input type="hidden" th:field="*{idProducto}">
                        <input type="hidden" th:field="*{estado}">
                        <div class="mb-3">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input class="form-control" th:field="*{nombre}" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="descripcion">Descripción</label>
                            <textarea class="form-control" rows="2" th:field="*{descripcion}" maxlength="255"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="idCategoria">Categoría</label>
                                <select class="form-select" id="idCategoria" name="idCategoria" required>
                                    <option value="">Seleccione una categoría</option>
                                    <option th:each="categoria : ${categorias}" th:value="${categoria.idCategoria}"
                                            th:text="${categoria.nombre}"
                                            th:selected="${categoria.idCategoria == idCategoria}"></option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="precio">Precio (S/)</label>
                                <input class="form-control" type="number" step="0.01" min="0" th:field="*{precio}" required>
                            </div>
                        </div>
                        <button class="btn btn-danger" type="submit">Registrar Producto / Servicio</button>
                        <a class="btn btn-outline-secondary" th:href="@{/productos}">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
