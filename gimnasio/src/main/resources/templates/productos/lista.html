<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Productos y servicios')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Productos / Servicios</h1>
        <a class="btn btn-danger" th:href="@{/productos/nuevo}">Nuevo producto o servicio</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Descripción</th>
                    <th class="text-end">Precio</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.categoria.nombre}"></td>
                    <td th:text="${producto.descripcion}"></td>
                    <td class="text-end" th:text="'S/ ' + ${producto.precio}"></td>
                    <td>
                        <span class="badge" th:classappend="${producto.estado} ? 'text-bg-success' : 'text-bg-secondary'"
                              th:text="${producto.estado} ? 'Activo' : 'Oculto'"></span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark" th:href="@{/productos/editar/{id}(id=${producto.idProducto})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/productos/estado/{id}(id=${producto.idProducto})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    th:text="${producto.estado} ? 'Ocultar' : 'Activar'"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${productos.isEmpty()}">
                    <td class="text-center text-muted py-4" colspan="6">No hay productos o servicios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
