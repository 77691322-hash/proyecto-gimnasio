<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecera('Clientes')}"></head>
<body class="bg-light">
<nav th:replace="~{fragmentos :: menu}"></nav>

<main class="container py-4">
    <div th:replace="~{fragmentos :: mensajes}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a class="btn btn-danger" th:href="@{/clientes/nuevo}">Nuevo cliente</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/clientes}">
        <div class="col-md-6">
            <input class="form-control" name="buscar" th:value="${buscar}" placeholder="Buscar por nombre o DNI">
        </div>
        <div class="col-md-4">
            <select class="form-select" name="membresia">
                <option value="">Todas las membresías</option>
                <option value="vigente" th:selected="${membresia == 'vigente'}">Con membresía vigente</option>
                <option value="sin" th:selected="${membresia == 'sin'}">Sin membresía vigente</option>
            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-dark w-100" type="submit">Buscar</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>DNI</th>
                    <th>Teléfono</th>
                    <th>Paquete</th>
                    <th>Estado de membresía</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cliente : ${clientes}" th:with="suscripcion=${membresias.get(cliente.idCliente)}"
                    th:classappend="${!cliente.estado} ? 'table-secondary'">
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.dni}"></td>
                    <td th:text="${cliente.telefono}"></td>
                    <td th:text="${suscripcion != null} ? ${suscripcion.paquete.nombre} : '-'"></td>
                    <td>
                        <span class="badge text-bg-success" th:if="${suscripcion != null}"
                              th:text="'Vigente hasta ' + ${#temporals.format(suscripcion.fechaFin, 'dd/MM/yyyy')}"></span>
                        <span class="badge text-bg-secondary" th:if="${suscripcion == null}">Sin membresía</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-dark" th:href="@{/clientes/editar/{id}(id=${cliente.idCliente})}">Editar</a>
                        <form class="d-inline" method="post" th:action="@{/clientes/estado/{id}(id=${cliente.idCliente})}">
                            <button class="btn btn-sm btn-outline-danger" type="submit"
                                    th:text="${cliente.estado} ? 'Dar de baja' : 'Reactivar'"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${clientes.isEmpty()}">
                    <td class="text-center text-muted py-4" colspan="6">No se encontraron clientes.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
