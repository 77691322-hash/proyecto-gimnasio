<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cobros - Gimnasio</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="barra-superior">
    <span>Sistema de Gestion de Gimnasio</span>
    <span>Administrador | <a href="login.html">Cerrar sesion</a></span>
  </div>

  <div class="container-fluid">
    <div class="row">

      <div class="col-md-3 menu-lateral">
        <ul>
          <li><a href="clientes.html">Clientes</a></li>
          <li><a href="membresias.html">Membresias</a></li>
          <li><a href="cobros.html">Cobros</a></li>
          <li><a href="personal.html">Personal</a></li>
          <li><a href="categorias.html">Categorias</a></li>
        </ul>
      </div>

      <div class="col-md-9 contenido">
        <h2 class="titulo-seccion">Registrar Cobro</h2>

        <div class="tarjeta">
          <form>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="txtCliente">Buscar cliente</label>
                <input type="text" class="form-control" id="txtCliente" name="cliente">
              </div>
              <div class="col-md-6 mb-3">
                <label for="txtPlan">Membresia / Plan</label>
                <select class="form-control" id="txtPlan" name="plan">
                  <option>Plan Mensual</option>
                  <option>Plan Trimestral</option>
                  <option>Plan Anual</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label for="txtMonto">Monto</label>
                <input type="number" class="form-control" id="txtMonto" name="monto">
              </div>
              <div class="col-md-6 mb-3">
                <label for="txtMetodoPago">Metodo de pago</label>
                <select class="form-control" id="txtMetodoPago" name="metodoPago">
                  <option>Efectivo</option>
                  <option>Tarjeta</option>
                  <option>Yape</option>
                </select>
              </div>
            </div>
            <button type="submit" class="btn boton-principal">Registrar Cobro</button>
            <button type="reset" class="btn btn-secondary">Cancelar</button>
          </form>
        </div>

        <div class="tarjeta">
          <h4>Comprobante</h4>
          <p>Cliente: Juan Perez</p>
          <p>Plan: Plan Mensual</p>
          <p>Fecha de inicio: 01/09/2025</p>
          <p>Fecha de vencimiento: 01/10/2025</p>
        </div>

      </div>

    </div>
  </div>

</body>
</html>
