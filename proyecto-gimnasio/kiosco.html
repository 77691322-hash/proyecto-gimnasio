<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiosco - Gimnasio</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="container contenido">
    <h2 class="titulo-seccion">Marcacion de Asistencia</h2>

    <div class="row">
      <div class="col-md-5 mx-auto">

        <div class="tarjeta">
          <div class="mb-3">
            <label for="txtDni">Ingrese su DNI</label>
            <input type="text" class="form-control" id="txtDni" name="dni">
          </div>
          <table class="w-auto mx-auto mb-3">
            <tbody>
              <tr>
                <td><button class="btn boton-principal btn-lg">1</button></td>
                <td><button class="btn boton-principal btn-lg">2</button></td>
                <td><button class="btn boton-principal btn-lg">3</button></td>
              </tr>
              <tr>
                <td><button class="btn boton-principal btn-lg">4</button></td>
                <td><button class="btn boton-principal btn-lg">5</button></td>
                <td><button class="btn boton-principal btn-lg">6</button></td>
              </tr>
              <tr>
                <td><button class="btn boton-principal btn-lg">7</button></td>
                <td><button class="btn boton-principal btn-lg">8</button></td>
                <td><button class="btn boton-principal btn-lg">9</button></td>
              </tr>
              <tr>
                <td></td>
                <td><button class="btn boton-principal btn-lg">0</button></td>
                <td></td>
              </tr>
            </tbody>
          </table>
          <button class="btn btn-secondary btn-lg w-100 mb-3">Borrar</button>
          <button class="btn boton-principal btn-lg w-100">Marcar Asistencia</button>
        </div>

        <div class="tarjeta">
          <p>Bienvenido Juan Perez - Entrada registrada 07:15</p>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
