<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesion - Gimnasio</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <div class="container">
    <div class="row">
      <div class="col-md-4 mx-auto mt-5">
        <div class="tarjeta">
          <h1 class="text-center">GYM SYSTEM</h1>
          <h2 class="text-center">Iniciar Sesion</h2>
          <form>
            <div class="mb-3">
              <label for="txtUsuario">Usuario o correo</label>
              <input type="text" class="form-control" id="txtUsuario" name="usuario"
                     placeholder="Ingrese su usuario o correo">
            </div>
            <div class="mb-3">
              <label for="txtContrasena">Contrasena</label>
              <input type="password" class="form-control" id="txtContrasena"
                     name="contrasena" placeholder="Ingrese su contrasena">
            </div>
            <a href="dashboard.html" class="btn boton-principal w-100">Iniciar Sesion</a>
          </form>
          <p class="text-center mt-3"><a href="#">Olvide mi contrasena</a></p>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
